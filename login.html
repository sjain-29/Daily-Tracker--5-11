<!doctype html>
<html lang="en" data-theme="dark" data-accent="blue" data-wallpaper="aurora" data-glass="tinted">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://apis.google.com https://*.firebasedatabase.app https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com https://www.google.com; frame-src https://www.google.com https://*.firebaseapp.com https://*.firebasedatabase.app; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sign in — Flightdeck</title>
  <meta name="description" content="Personal productivity and R&amp;D project dashboard: tasks, projects, calendar, Kanban, timeline, meetings and analytics.">
  <meta name="theme-color" content="#06070b">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flightdeck">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&amp;display=swap">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/boot-theme.js"></script>
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>
  <main class="login-shell">
    <section class="login-brand" aria-hidden="true">
      <div class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></div>
      <h1>Flightdeck</h1>
      <p>Your tasks, R&amp;D projects, meetings and focus — in one calm place.</p>
      <ul class="login-points">
        <li>Automatic overdue &amp; not-started flags</li>
        <li>Kanban, calendar and timeline views</li>
        <li>Real-time sync across your devices</li>
      </ul>
    </section>
    <section class="card login-card" aria-labelledby="login-title">
      <div class="login-card-brand"><div class="brand-mark sm"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></div><strong>Flightdeck</strong></div>
      <div id="login-content">
        <div class="spinner" style="margin:40px auto"></div>
      </div>
    </section>
  </main>
</body>
</html>
